[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-maintainer-check"
version = "0.1.0"
description = "A transparent, local checklist for open-source repository maintenance basics"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "OSS Maintainer Check contributors" }]
keywords = ["open-source", "maintainers", "repository", "checklist", "health"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
oss-maintainer-check = "oss_maintainer_check.cli:main"

[tool.setuptools.packages.find]
include = ["oss_maintainer_check*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
